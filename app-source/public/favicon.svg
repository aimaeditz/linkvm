<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="32" height="32" rx="7.5" fill="url(#fav-bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" />

  <!-- Crisp Geometric VM Monogram at 32x32 Scale -->
  <!-- V Letterform (Pure White #FFFFFF) -->
  <polygon points="5,10 7.5,10 9.5,18 11.5,10 14,10 10.5,22 8.5,22" fill="#FFFFFF" />

  <!-- M Letterform (Soft Light Indigo #E0E7FF) -->
  <polygon points="15.5,10 18,10 21,16.5 24,10 26.5,10 26.5,22 24.2,22 24.2,13.5 21,19 18,13.5 18,22 15.5,22" fill="#E0E7FF" />
</svg>
