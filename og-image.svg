<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Soft Light Gradient (135deg) -->
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>

    <!-- Glowing Subtle Orbs -->
    <radialGradient id="orb-left" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-right" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <!-- Dotted Grid Pattern -->
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#6366F1" fill-opacity="0.1" />
    </pattern>

    <!-- Mark Gradient -->
    <linearGradient id="mark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="mark-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#312E81" flood-opacity="0.08" />
    </filter>

    <filter id="mark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#dot-grid)" />
  <circle cx="180" cy="140" r="450" fill="url(#orb-left)" />
  <circle cx="1020" cy="490" r="450" fill="url(#orb-right)" />

  <!-- Main Card Container -->
  <g filter="url(#card-shadow)">
    <rect x="100" y="85" width="1000" height="460" rx="32" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" stroke-width="2" />
  </g>

  <!-- Left Side: LinkVM Mark (140x140) -->
  <g transform="translate(160, 165)">
    <!-- Container Base -->
    <rect x="0" y="0" width="140" height="140" rx="32" fill="url(#mark-bg)" />
    <!-- Gloss -->
    <path d="M 0 32 C 0 14.3 14.3 0 32 0 L 108 0 C 125.7 0 140 14.3 140 32 L 140 50 Q 70 68 0 50 Z" fill="url(#mark-gloss)" />
    <!-- 1px Rim -->
    <rect x="1" y="1" width="138" height="138" rx="31" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />

    <!-- Scaled VM Monogram inside 140x140 (scale 0.273) -->
    <g transform="scale(0.273)" filter="url(#mark-shadow)">
      <!-- V Letterform -->
      <path d="M 84 160 L 120 160 L 150 280 L 180 160 L 218 160 L 164 352 L 136 352 Z" fill="#FFFFFF" />
      <!-- M Letterform -->
      <path d="M 220 160 L 254 160 L 325 250 L 396 160 L 430 160 L 430 352 L 396 352 L 396 210 L 325 300 L 254 210 L 254 352 L 220 352 Z" fill="#E0E7FF" />
      <!-- Link Glyph -->
      <g transform="translate(10, 0)">
        <rect x="396" y="112" width="28" height="15" rx="7.5" fill="none" stroke="#FFFFFF" stroke-width="4.5" transform="rotate(-45 410 119.5)" opacity="0.9" />
        <rect x="412" y="128" width="28" height="15" rx="7.5" fill="none" stroke="#38BDF8" stroke-width="4.5" transform="rotate(-45 426 135.5)" opacity="0.9" />
      </g>
    </g>
  </g>

  <!-- Right Side: Wordmark + Domain Badge -->
  <g transform="translate(330, 210)">
    <!-- Wordmark -->
    <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="64" fill="#0F172A" letter-spacing="-2">
      Link<tspan fill="#4F46E5">VM</tspan>
    </text>

    <!-- Domain Pill Badge -->
    <g transform="translate(265, -46)">
      <rect x="0" y="0" width="136" height="34" rx="17" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
      <text x="68" y="22" font-family="'Space Grotesk', monospace" font-weight="700" font-size="14" fill="#4F46E5" text-anchor="middle">linkvm.online</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="55" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="28" fill="#475569">
      All your links. One premium page.
    </text>
  </g>

  <!-- Description Line -->
  <text x="160" y="370" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="20" fill="#64748B">
    The 100% free forever link-in-bio platform with custom themes, real-time analytics, and QR codes.
  </text>

  <!-- Bottom Strip: 3 Small Soft Indigo Chips -->
  <g transform="translate(160, 420)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="170" height="40" rx="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
    <text x="85" y="25" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="14" fill="#4F46E5" text-anchor="middle">100% Free Forever</text>

    <!-- Chip 2 -->
    <rect x="186" y="0" width="180" height="40" rx="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
    <text x="276" y="25" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="14" fill="#4F46E5" text-anchor="middle">All Themes Unlocked</text>

    <!-- Chip 3 -->
    <rect x="382" y="0" width="175" height="40" rx="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
    <text x="469" y="25" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="14" fill="#4F46E5" text-anchor="middle">Real-time Analytics</text>
  </g>

  <!-- Footer Credit -->
  <text x="1050" y="515" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" text-anchor="end">
    Created by AiMAEditz
  </text>
</svg>
